apiVersion: v1
kind: Pod
metadata:
  name: b07-b14-bench
  namespace: <benchmark-namespace>
  labels:
    app: b07-b14-bench
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 7200
  nodeSelector:
    kubernetes.io/hostname: <h200-node>
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: bench
      image: <internal-registry>/vllm/vllm-openai:v0.25.1
      command: ["/bin/bash", "/scripts/run-b07-b14.sh"]
      env:
        - name: HOME
          value: /work
        - name: USER
          value: bench
        - name: HF_HOME
          value: /cache/hf
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: HF_HUB_DISABLE_TELEMETRY
          value: "1"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /work/inductor
        - name: TRITON_CACHE_DIR
          value: /work/triton
        - name: VLLM_NO_USAGE_STATS
          value: "1"
        - name: RESULT_ROOT
          value: /cache/results
      resources:
        requests: { cpu: "16", memory: 96Gi, nvidia.com/gpu: "1" }
        limits: { cpu: "16", memory: 96Gi, nvidia.com/gpu: "1" }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: work
          mountPath: /work
        - name: cache
          mountPath: /cache
        - name: scripts
          mountPath: /scripts
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: work
      emptyDir:
        sizeLimit: 60Gi
    - name: cache
      persistentVolumeClaim:
        claimName: b07-b14-hf-cache
    - name: scripts
      configMap:
        name: b07-b14-script
        defaultMode: 0555
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
