apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: b07-b14-hf-cache
  namespace: <benchmark-namespace>
  labels:
    app: b07-b14-bench
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: lvms-vg-gpu-06
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: b07-b14-download
  namespace: <benchmark-namespace>
  labels:
    app: b07-b14-bench
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  nodeSelector:
    kubernetes.io/hostname: <h200-node>
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: download
      image: <internal-registry>/vllm/vllm-openai:v0.25.1
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail
          mkdir -p /cache/hf
          find /cache/hf -name '*.incomplete' -delete
          for i in 1 2 3 4 5; do
            timeout 900 hf download Qwen/Qwen2.5-7B-Instruct && echo DOWNLOAD_OK && break
            echo RETRY_$i
            find /cache/hf -name '*.incomplete' -delete
          done
          test -d /cache/hf/hub
          du -sh /cache/hf
      env:
        - name: HOME
          value: /cache
        - name: HF_HOME
          value: /cache/hf
        - name: HF_HUB_DISABLE_TELEMETRY
          value: "1"
        - name: HF_HUB_DOWNLOAD_TIMEOUT
          value: "60"
      resources:
        requests: { cpu: "2", memory: 16Gi }
        limits: { cpu: "2", memory: 16Gi }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: cache
          mountPath: /cache
        - name: ca
          mountPath: /etc/ssl/certs/ca-certificates.crt
          subPath: ca-bundle.crt
          readOnly: true
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: b07-b14-hf-cache
    - name: ca
      configMap:
        name: ca-bundle-config
